<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="100%" height="100%" style="background:#0a141e; font-family:'Segoe UI', Georgia, serif;">
  <defs>
    <radialGradient id="oceanGrad" cx="45%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#112436"/>
      <stop offset="70%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#050b12"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1b354d" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.5"/>
    </pattern>
    <pattern id="unclaimedHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#c87a32" stroke-width="1.8" opacity="0.32"/>
    </pattern>
    <pattern id="warbandHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b71c1c" stroke-width="2" opacity="0.35"/>
    </pattern>
    <pattern id="freeStateDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.4" fill="#b388ff" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#02060a" flood-opacity="0.85"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ocean & Blueprint Grid -->
  <rect width="1200" height="1100" fill="url(#oceanGrad)"/>
  <rect width="1200" height="1100" fill="url(#grid)"/>

  <!-- Outer Brass Frame -->
  <rect x="14" y="14" width="1172" height="1072" fill="none" stroke="#c5a059" stroke-width="2.5"/>
  <rect x="20" y="20" width="1160" height="1060" fill="none" stroke="#c5a059" stroke-width="0.8" stroke-dasharray="6,4"/>

  <!-- ==================== VITAL CLAIMED COASTAL WATERS (SHADED MARITIME ZONES) ==================== -->
  <!-- Coastal waters are vital and claimed by the kingdoms except in the Far North -->
  <g opacity="0.22">
    <!-- Arclean North Sea Claimed Waters -->
    <polygon points="335,285 455,275 535,435 510,525 385,515 350,395" fill="#4fc3f7" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Feydial Irish Sea & Celtic Coastal Waters -->
    <polygon points="180,350 325,365 348,510 215,525 155,445" fill="#26a69a" stroke="#26a69a" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Derdore English Channel & Bay Approaches -->
    <polygon points="245,515 505,525 465,610 250,605" fill="#ef5350" stroke="#ef5350" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Western Atlantic / Biscay Coastal Kingdom Claims -->
    <polygon points="250,605 385,610 345,765 165,865 135,745 225,675" fill="#ab47bc" stroke="#ab47bc" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Southern & Central Baltic / North German Coastal Claims -->
    <polygon points="455,275 565,335 765,310 785,415 535,435" fill="#ffa726" stroke="#ffa726" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Northern Mediterranean Coastal Corridor (North of Barcelona Limit) -->
    <polygon points="305,865 485,815 685,875 645,945 295,915" fill="#66bb6a" stroke="#66bb6a" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- ==================== LANDMASSES & AREAS OF CONTROL ==================== -->
  <g filter="url(#shadow)">

    <!-- 1. ICELAND (High Elves — Far NW) -->
    <path d="M 85 75 L 175 62 L 198 98 L 155 132 L 88 122 Z" fill="#1a3d4d" stroke="#80deea" stroke-width="2"/>

    <!-- 2. THE FAR NORTH — FREE STATES (Norway, Sweden, Finland & Northern Isles) -->
    <!-- Independent Spires with 1 or 2 captured Spires constantly changing hands; Unclaimed Northern Waters -->
    <path d="M 485 265 L 465 215 L 495 145 L 575 75 L 685 45 L 825 55 L 895 125 L 885 235 L 815 275 L 775 245 L 765 165 L 705 175 L 685 265 L 635 325 L 575 315 L 555 245 L 525 275 Z" fill="#28203d" stroke="#b388ff" stroke-width="2"/>
    <path d="M 485 265 L 465 215 L 495 145 L 575 75 L 685 45 L 825 55 L 895 125 L 885 235 L 815 275 L 775 245 L 765 165 L 705 175 L 685 265 L 635 325 L 575 315 L 555 245 L 525 275 Z" fill="url(#freeStateDots)"/>
    <!-- Norwegian Mountain Elven Colonies (High Aither Peaks) -->
    <path d="M 498 158 L 568 92 L 615 98 L 542 195 Z" fill="#1a3d4d" stroke="#80deea" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- 3. BRITISH ISLES & NORTH SEA FOOTHOLD (Arclean, Feydial, Derdore + Wild Western Highlands) -->
    <!-- Savage Western Highlands (Unclaimed / Orc Warbands) -->
    <path d="M 312 295 L 348 292 L 342 355 L 315 372 L 298 335 Z" fill="#2d231e" stroke="#ffab40" stroke-width="1.5"/>
    <path d="M 312 295 L 348 292 L 342 355 L 315 372 L 298 335 Z" fill="url(#unclaimedHatch)"/>
    <!-- Arclean (E. Scotland, NE England, York/Norwich) -->
    <path d="M 348 292 L 382 308 L 375 365 L 412 425 L 428 475 L 402 492 L 368 445 L 342 355 Z" fill="#173852" stroke="#4fc3f7" stroke-width="2"/>
    <!-- Feydial (Ireland, Wales, Isle of Man — w/ Western Atlantic Unclaimed Fringe) -->
    <path d="M 215 395 L 268 388 L 285 435 L 265 488 L 212 495 L 188 455 Z" fill="#193d33" stroke="#4db6ac" stroke-width="2"/>
    <!-- Unclaimed Western Irish Fringe -->
    <path d="M 188 455 L 215 395 L 232 415 L 222 485 L 212 495 Z" fill="url(#unclaimedHatch)" stroke="#ffab40" stroke-width="1.2"/>
    <!-- Wales (Feydial) -->
    <path d="M 318 455 L 352 455 L 355 498 L 318 498 Z" fill="#193d33" stroke="#4db6ac" stroke-width="1.8"/>
    <!-- Derdore (Rest of England) -->
    <path d="M 342 395 L 368 445 L 402 492 L 418 518 L 312 532 L 355 498 L 352 455 L 335 425 Z" fill="#462228" stroke="#ef5350" stroke-width="2"/>

    <!-- 4. MAINLAND EUROPE — COASTAL KINGDOM BELTS vs. EXPANDING WESTERN UNCLAIMED TERRITORY -->
    <!-- Arclean Dutch Foothold (The Hague & Rotterdam) -->
    <path d="M 472 475 L 515 448 L 532 485 L 485 512 Z" fill="#173852" stroke="#4fc3f7" stroke-width="2.2"/>

    <!-- Derdore Northern French Coast (~50 miles inland) -->
    <path d="M 345 565 L 435 545 L 485 512 L 502 538 L 442 582 L 352 595 Z" fill="#462228" stroke="#ef5350" stroke-width="2"/>

    <!-- NORTH SEA, BALTIC & CENTRAL EUROPEAN KINGDOMS (Claimed Coastal & River Heartlands) -->
    <path d="M 515 448 L 565 365 L 615 375 L 645 415 L 785 385 L 835 345 L 865 445 L 835 585 L 745 665 L 645 655 L 545 585 L 502 538 L 485 512 Z" fill="#2d291e" stroke="#ffd54f" stroke-width="2"/>

    <!-- SOUTHERN & ALPINE / MEDITERRANEAN COASTAL KINGDOMS (North of Barcelona Limit) -->
    <path d="M 345 775 L 445 725 L 545 685 L 645 655 L 745 665 L 785 775 L 725 895 L 665 925 L 615 835 L 525 815 L 415 855 L 325 895 Z" fill="#1e3326" stroke="#66bb6a" stroke-width="2"/>

    <!-- EXPANDING UNCLAIMED TERRITORY (Increasingly Vast Heading West into Interior France, Brittany & Iberia) -->
    <!-- As you head West across mainland Europe and Iberia, Unclaimed / Warband Territory expands dramatically -->
    <path d="M 255 585 L 352 595 L 442 582 L 502 538 L 545 585 L 645 655 L 545 685 L 445 725 L 345 775 L 325 895 L 225 935 L 155 915 L 145 765 L 205 745 L 315 725 L 285 645 Z" fill="#2d211b" stroke="#ffab40" stroke-width="2.2"/>
    <path d="M 255 585 L 352 595 L 442 582 L 502 538 L 545 585 L 645 655 L 545 685 L 445 725 L 345 775 L 325 895 L 225 935 L 155 915 L 145 765 L 205 745 L 315 725 L 285 645 Z" fill="url(#unclaimedHatch)"/>

    <!-- Narrow Claimed Atlantic Coastal Strips (Keeping Vital Coastal Waters Claimed) -->
    <path d="M 315 625 L 352 595 L 372 625 L 345 725 L 315 725 Z" fill="#362238" stroke="#ce93d8" stroke-width="1.8"/>
    <path d="M 145 765 L 245 745 L 255 772 L 178 805 L 165 885 L 142 875 Z" fill="#362238" stroke="#ce93d8" stroke-width="1.8"/>

    <!-- 5. SOUTH OF BARCELONA — UNINHABITABLE DEEP NEITHER ZONE (No Spires Possible) -->
    <path d="M 155 915 L 325 895 L 315 965 L 175 975 Z" fill="#1a1111" stroke="#e53935" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- 6. EAST OF EUROPE — THE LAND OF THE WARBANDS -->
    <path d="M 885 235 L 895 125 L 1165 125 L 1165 965 L 835 965 L 785 775 L 745 665 L 835 585 L 865 445 L 835 345 L 815 275 Z" fill="#2b1414" stroke="#e53935" stroke-width="2.5"/>
    <path d="M 885 235 L 895 125 L 1165 125 L 1165 965 L 835 965 L 785 775 L 745 665 L 835 585 L 865 445 L 835 345 L 815 275 Z" fill="url(#warbandHatch)"/>
  </g>

  <!-- ==================== SOUTHERN BARCELONA LIMIT LINE ==================== -->
  <line x1="120" y1="895" x2="850" y2="895" stroke="#ff5252" stroke-width="2.8" stroke-dasharray="10,6"/>
  <rect x="265" y="881" width="430" height="26" rx="4" fill="#1a0808" stroke="#ff5252" stroke-width="1.5"/>
  <text x="480" y="898" fill="#ff8a80" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="1">SOUTHERN SPIRE LIMIT (SOUTH OF BARCELONA — NEITHER TOO DEEP)</text>

  <!-- ==================== ANNOTATIONS & ZONE LABELS ==================== -->

  <!-- 1. ICELAND -->
  <text x="140" y="98" fill="#80deea" font-size="12" font-weight="bold" text-anchor="middle">ICELAND</text>
  <text x="140" y="114" fill="#b2ebf2" font-size="10" text-anchor="middle">(High Elven Realm)</text>

  <!-- 2. FAR NORTH FREE STATES -->
  <g text-anchor="middle">
    <rect x="555" y="120" width="295" height="72" rx="5" fill="#140e24" stroke="#b388ff" stroke-width="1.8" opacity="0.94"/>
    <text x="702" y="142" fill="#d1c4e9" font-size="14" font-weight="bold" letter-spacing="1">THE FAR NORTH: FREE STATES</text>
    <text x="702" y="159" fill="#b39ddb" font-size="10.5">(Norway, Sweden &amp; Finland — Unclaimed Waters)</text>
    <text x="702" y="175" fill="#ede7f6" font-size="10" font-style="italic">Independent Spires; 1–2 Captured Spires Constantly Changing Hands</text>
  </g>
  <text x="485" y="125" fill="#80deea" font-size="10" font-weight="bold" text-anchor="end">Norwegian Mountain</text>
  <text x="485" y="138" fill="#80deea" font-size="10" font-weight="bold" text-anchor="end">Elven Colonies ▶</text>

  <!-- 3. ISLES & NORTH SEA -->
  <g font-weight="bold" text-anchor="middle">
    <text x="395" y="345" fill="#4fc3f7" font-size="13">ARCLEAN</text>
    <circle cx="368" cy="348" r="6" fill="#ffd54f" stroke="#ffffff" stroke-width="1.5"/>
    <text x="235" y="445" fill="#4db6ac" font-size="12.5">FEYDIAL</text>
    <text x="378" y="512" fill="#ef5350" font-size="12.5">DERDORE</text>
    <text x="512" y="440" fill="#4fc3f7" font-size="10">Arclean Dutch</text>
    <text x="512" y="452" fill="#4fc3f7" font-size="10">Twin Spires</text>
  </g>

  <!-- 4. CENTRAL & COASTAL EUROPEAN KINGDOMS -->
  <g text-anchor="middle">
    <rect x="565" y="465" width="265" height="74" rx="5" fill="#1c1911" stroke="#ffd54f" stroke-width="1.8" opacity="0.94"/>
    <text x="697" y="487" fill="#ffd54f" font-size="13.5" font-weight="bold" letter-spacing="1">CLAIMED EUROPEAN KINGDOMS</text>
    <text x="697" y="505" fill="#fff59d" font-size="10.5">Vital Coastal Waters &amp; Air Borders Claimed</text>
    <text x="697" y="522" fill="#cfd8dc" font-size="9.5" font-style="italic">(Radiating Spire Control → Free Folk, Orcs, Mines &amp; Ruins)</text>
  </g>

  <g text-anchor="middle">
    <rect x="525" y="725" width="245" height="54" rx="5" fill="#102116" stroke="#66bb6a" stroke-width="1.6" opacity="0.94"/>
    <text x="647" y="747" fill="#a5d6a7" font-size="12.5" font-weight="bold">HIGH-ELEVATION SOUTHERN KINGDOMS</text>
    <text x="647" y="764" fill="#c8e6c9" font-size="10" font-style="italic">Taller Spires on High Mountain Peaks</text>
  </g>

  <!-- 5. EXPANDING WESTERN UNCLAIMED TERRITORY -->
  <g text-anchor="middle">
    <rect x="195" y="632" width="285" height="76" rx="5" fill="#1f1510" stroke="#ffab40" stroke-width="2" opacity="0.95"/>
    <text x="337" y="654" fill="#ffab40" font-size="13.5" font-weight="bold" letter-spacing="1">UNCLAIMED TERRITORY</text>
    <text x="337" y="672" fill="#ffe0b2" font-size="11" font-weight="bold">(Expands Dramatically Heading West)</text>
    <text x="337" y="690" fill="#cfd8dc" font-size="10" font-style="italic">No Kingdom Air/Land Claim; Wild Frontier,</text>
    <text x="337" y="703" fill="#cfd8dc" font-size="10" font-style="italic">Orc Warbands &amp; Isolated Lawless Outposts</text>
  </g>
  <text x="235" y="845" fill="#ffab40" font-size="12" font-weight="bold" text-anchor="middle">VAST WESTERN</text>
  <text x="235" y="862" fill="#ffab40" font-size="12" font-weight="bold" text-anchor="middle">UNCLAIMED INTERIOR</text>

  <!-- 6. LAND OF THE WARBANDS (EAST) -->
  <g text-anchor="middle">
    <rect x="885" y="425" width="255" height="115" rx="6" fill="#1f0b0b" stroke="#e53935" stroke-width="2" opacity="0.95"/>
    <text x="1012" y="452" fill="#ff8a80" font-size="15" font-weight="bold" letter-spacing="1.5">THE LAND OF THE</text>
    <text x="1012" y="472" fill="#ff8a80" font-size="15" font-weight="bold" letter-spacing="1.5">WARBANDS</text>
    <text x="1012" y="494" fill="#ffcdd2" font-size="10.5">Controlled by Sovereign Orc Hordes</text>
    <text x="1012" y="514" fill="#ef9a9a" font-size="10" font-style="italic">Farther East ▶ Rumored Asian Spires</text>
    <text x="1012" y="528" fill="#ef9a9a" font-size="10" font-style="italic">(Trade Goods Only — Zero Direct Contact)</text>
  </g>

  <!-- 7. WESTERN OCEAN / AMERICAS RUMOR -->
  <g text-anchor="middle">
    <rect x="34" y="535" width="155" height="68" rx="4" fill="#091520" stroke="#80deea" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.92"/>
    <text x="111" y="555" fill="#80deea" font-size="10.5" font-weight="bold">◀ FAR ACROSS ATLANTIC</text>
    <text x="111" y="572" fill="#cfd8dc" font-size="9.5" font-style="italic">Unacknowledged Rumors of</text>
    <text x="111" y="586" fill="#cfd8dc" font-size="9.5" font-style="italic">Civilization in the Americas</text>
  </g>

  <!-- ==================== ROSTER OF EUROPEAN KINGDOMS & LEGEND (BOTTOM PANEL) ==================== -->
  <g transform="translate(34, 932)">
    <rect width="1132" height="136" rx="6" fill="#08131d" stroke="#c5a059" stroke-width="2" opacity="0.96"/>

    <text x="20" y="26" fill="#c5a059" font-size="14" font-weight="bold" letter-spacing="1.2">EUROPEAN KINGDOMS ROSTER (LOCATIONS UNFIXED BEYOND THE ISLES) &amp; CONTROL LEGEND</text>
    <line x1="20" y1="34" x2="1112" y2="34" stroke="#c5a059" stroke-width="0.8" opacity="0.6"/>

    <!-- Column 1: Named Kingdoms Roster -->
    <text x="20" y="54" fill="#ffd54f" font-size="11.5" font-weight="bold">• Named European Kingdoms (Unfixed Continental Locations):</text>
    <text x="30" y="72" fill="#e0e6ed" font-size="11">1. <tspan font-weight="bold" fill="#ffd54f">Relocore</tspan> (Largest continental military/army)   2. <tspan font-weight="bold" fill="#ffd54f">High Bremen</tspan> (Mercantile &amp; industrial power)   3. <tspan font-weight="bold" fill="#ffd54f">Malichor</tspan> (Major continental kingdom)</text>
    <text x="30" y="90" fill="#e0e6ed" font-size="11">4. <tspan font-weight="bold" fill="#ffd54f">Valdris</tspan> (Coastal/maritime kingdom)   5. <tspan font-weight="bold" fill="#ffd54f">Korsova</tspan> (Eastern marches kingdom)   6. <tspan font-weight="bold" fill="#ffd54f">Aurelia</tspan> (Western coastal kingdom)</text>
    <text x="30" y="108" fill="#e0e6ed" font-size="11">7. <tspan font-weight="bold" fill="#ffd54f">Monteverde</tspan> (High-elevation southern mountain kingdom)   8. <tspan font-weight="bold" fill="#ffd54f">Sylvania</tspan> (Central river/forest kingdom)   9. <tspan font-weight="bold" fill="#b388ff">The Free States / Free Cities</tspan> (Far North)</text>
    <text x="30" y="124" fill="#81d4fa" font-size="10.5" font-style="italic">Fixed Isle/Channel Kingdoms: Arclean (E. Scotland/NE England/NL), Feydial (Ireland/Wales/Isle of Man), Derdore (S. England/N. France).</text>

    <!-- Column 2: Map Legend -->
    <line x1="725" y1="42" x2="725" y2="128" stroke="#c5a059" stroke-width="0.8" opacity="0.5"/>
    <rect x="742" y="45" width="16" height="10" fill="#4fc3f7" opacity="0.4" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="766" y="54" fill="#b3e5fc" font-size="10.5" font-weight="bold">Claimed Coastal Waters (Vital Everywhere Except Far North)</text>

    <rect x="742" y="65" width="16" height="10" fill="#28203d" stroke="#b388ff" stroke-width="1.5"/>
    <text x="766" y="74" fill="#d1c4e9" font-size="10.5" font-weight="bold">Far North Free States (Independent Spires; 1–2 Captured/Shifting)</text>

    <rect x="742" y="85" width="16" height="10" fill="url(#unclaimedHatch)" stroke="#ffab40" stroke-width="1.5"/>
    <text x="766" y="94" fill="#ffe0b2" font-size="10.5" font-weight="bold">Unclaimed Territory (Increases Dramatically Heading West)</text>

    <rect x="742" y="105" width="16" height="10" fill="url(#warbandHatch)" stroke="#e53935" stroke-width="1.5"/>
    <text x="766" y="114" fill="#ffcdd2" font-size="10" font-weight="bold">Land of Warbands &amp; Unaligned Surface (Orcs/Free Folk/Ruins)</text>
  </g>
</svg>

